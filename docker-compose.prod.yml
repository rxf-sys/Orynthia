version: "3.9"

# Production Overrides für Homeserver / Proxmox
# Nutzung: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  backend:
    build:
      target: production
    # Die Bind-Mounts der Entwicklung fallen weg – das Dokumenten-Volume
    # bleibt, sonst wären hochgeladene Dateien nach jedem Deploy weg.
    volumes: !reset
      - documents_data:/app/data/documents
    restart: always

  frontend:
    build:
      target: production
    volumes: !reset []
    ports: !reset []
    restart: always

  postgres:
    ports: !reset []
    restart: always

  redis:
    ports: !reset []
    restart: always

  nginx:
    restart: always
